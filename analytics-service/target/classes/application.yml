server:
  port: 8084

spring:
  application:
    name: analytics-service
  kafka:
    bootstrap-servers: localhost:9094
    listener:
      missing-topics-fatal: false
  datasource:
    url: jdbc:postgresql://localhost:5432/analytics
    username: analytics
    password: analytics
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
