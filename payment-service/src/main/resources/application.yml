server:
  port: 8082

spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: localhost:9094
    listener:
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
